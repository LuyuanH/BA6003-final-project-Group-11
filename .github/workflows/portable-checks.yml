name: Portable application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install the specified Python and uv versions
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          python-version: "3.13.15"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the specified application and test dependencies
        run: uv sync --frozen --extra dev
      - name: Run Python code and format checks
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
      - name: Run unit, database, import, and Streamlit startup tests
        run: uv run --frozen --extra dev python -m unittest discover -s tests -t . -v
      - name: Validate the frontend event queue
        run: node tests/frontend/review_queue.test.cjs
      - name: Build the source distribution and wheel
        run: uv build --out-dir dist
      - name: Validate distribution contents
        run: uv run --frozen python tests/packaging/verify_distribution.py --dist-dir dist
