<main class="amlens" data-aria="app">
<header class="topbar">
<a class="brand" href="#" data-action="overview" data-aria="home"><span class="brand-mark">◈</span> AMLens<span class="brand-divider"></span><span class="brand-sub" data-i18n="workspace"></span></a>
<nav data-aria="navigation"><button class="nav active" data-action="overview" data-i18n="overview"></button><button class="nav" data-role="nav-investigate"><span data-i18n="investigate"></span><span class="nav-count" data-role="nav-count">0</span></button></nav>
<div class="topbar-tools"><div class="language-switch" role="group" data-aria="language"><button data-action="language" data-value="zh" lang="zh-CN">中文</button><button data-action="language" data-value="en" lang="en">English</button></div><span class="team"><span class="avatar">R</span><span data-i18n="team"></span></span></div>
</header>
<section class="workspace-head"><div class="workspace-title"><h1 data-i18n="heading"></h1></div>
<div class="playback" data-aria="timeControls"><div class="replay-clock"><span data-role="day"></span><strong data-role="clock">00:00</strong></div><div class="playback-settings"><select class="speed" data-aria="speed" data-role="speed"><option value="900">900×</option><option value="3600">3,600×</option><option value="14400">14,400×</option><option value="28800">28,800×</option></select><button class="primary play" data-action="play" data-role="play"></button></div></div></section>
<section class="metrics" data-aria="metrics">
<div class="metric"><span class="metric-label" data-i18n="processed"></span><strong class="number" data-role="processed">0</strong><span class="metric-note" data-role="processed-note"></span></div>
<div class="metric"><span class="metric-label" data-i18n="hold"></span><strong class="number" data-role="hold">0</strong><span class="metric-note" data-i18n="holdNote"></span></div>
<div class="metric"><span class="metric-label" data-i18n="pendingCases"></span><strong class="number" data-role="pending">0</strong><span class="metric-note" data-role="case-note"></span></div>
</section>
<div data-role="overview"><div class="main-grid">
<section class="card network-card"><div class="card-head"><h2 data-i18n="network"></h2><button class="dark-button" data-role="graph-open" data-i18n="open"></button></div><div class="network-context" data-role="graph-context"></div><div class="network" data-role="network" role="img" data-aria="networkAria"></div><div class="graph-empty" data-role="graph-empty"><span>↗</span><strong data-i18n="waitCase"></strong><p data-i18n="waitHint"></p></div><div class="network-bottom"><span data-role="graph-summary"></span><span data-i18n="legend"></span></div></section>
<section class="card patterns-card"><div class="card-head"><h2 data-i18n="patterns"></h2><button class="text-button" data-role="clear-pattern"></button></div><div class="pattern-caption"><span data-i18n="pattern"></span><span data-i18n="hold"></span></div><div data-role="patterns" class="pattern-list"></div></section>
</div><div class="bottom-grid">
<section class="card queue-card"><div class="card-head"><h2><span data-i18n="queue"></span><span class="count" data-role="queue-count">0</span></h2><input data-aria="search" data-placeholder="searchPlaceholder" data-role="queue-search" class="search"></div><div class="table-wrap queue-wrap"><table class="queue-table"><thead><tr><th data-i18n="casePattern"></th><th data-i18n="accountEntity"></th><th class="numeric" data-i18n="tx"></th><th data-i18n="queued"></th><th data-i18n="status"></th><th></th></tr></thead><tbody data-role="queue"></tbody></table><div data-role="queue-empty" class="table-empty"></div></div></section>
<section class="card trend-card"><div class="card-head"><h2 data-i18n="trend"></h2><span class="trend-unit" data-i18n="transactionsUnit"></span></div><div class="trend" data-role="trend" role="img" data-aria="trendAria"></div><div class="trend-footer"><span data-role="trend-start"></span><span data-role="trend-end"></span></div></section>
</div>
<section class="card analysis-card insight-card" aria-labelledby="insight-heading">
<div class="card-head"><h2 id="insight-heading" data-i18n="insightTitle"></h2><button class="primary" data-action="overview_insight" data-role="insight-generate" data-i18n="insightGenerate"></button></div>
<p class="analysis-meta" data-role="insight-meta"></p><p class="analysis-notice" data-role="insight-notice" role="status" hidden></p>
<div data-role="insight-body" aria-live="polite" aria-atomic="true"></div><p class="insight-stale" data-role="insight-stale" data-i18n="insightStale" hidden></p>
<p class="analysis-footnote" data-role="insight-footnote" data-i18n="insightFootnote" hidden></p>
</section></div>
<section class="investigation" data-role="investigation" hidden>
<div class="case-bar"><div class="case-identity"><button class="text-button" data-action="overview" data-i18n="back"></button><span class="case-title" data-role="case-title"></span><span class="badge" data-role="case-status"></span></div><div class="case-actions"><button class="secondary" data-action="analyze" data-role="analyze" data-i18n="startInvestigation"></button><button class="primary" data-role="finish-review" data-i18n="finishReview"></button><button class="secondary" data-action="status" data-value="pending" data-role="reopen" data-i18n="reopen" hidden></button></div></div>
<section class="card review-summary" data-role="review-summary" hidden><h2 data-i18n="reviewConclusion"></h2><strong data-role="review-type"></strong><p data-role="review-comment"></p></section>
<div class="detail-grid"><section class="card network-card detail-network-card"><div class="card-head"><h2 data-i18n="paths"></h2><button class="dark-button" data-role="clear-account" data-i18n="allAccounts"></button></div><div class="network detail-network" data-role="detail-network" role="img" data-aria="pathsAria"></div><div class="network-bottom"><span data-role="detail-summary"></span><span data-i18n="pathHint"></span></div></section><aside class="card account-card"><div class="card-head"><h2 data-role="account-title"></h2></div><div data-role="account-info"></div></aside></div>
<section class="card analysis-card" aria-labelledby="analysis-heading"><div class="card-head"><h2 id="analysis-heading" data-i18n="aiTitle"></h2><span class="analysis-meta" data-role="analysis-meta"></span></div><p class="analysis-notice" data-role="analysis-notice" role="status" hidden></p><div data-role="analysis-body" aria-live="polite" aria-atomic="true"></div><p class="analysis-footnote" data-i18n="aiFootnote"></p></section>
<section class="card evidence-card"><div class="card-head"><div class="tabs"><button class="tab active" data-tab="transactions"><span data-i18n="evidence"></span><span class="tab-count" data-role="tx-count"></span></button><button class="tab" data-tab="accounts"><span data-i18n="accounts"></span><span class="tab-count" data-role="account-count"></span></button></div><button class="text-button" data-role="clear-evidence"></button></div><div class="table-wrap evidence-wrap" data-role="evidence"></div></section>
</section>
<footer class="page-footer"><span data-role="footer-time"></span></footer><div class="connection-message" data-role="connection-message" data-i18n="connection" hidden></div>
<dialog class="review-dialog" data-role="review-dialog" aria-labelledby="review-title">
<form data-role="review-form">
<h2 id="review-title" data-i18n="finishReview"></h2><p data-role="review-case"></p>
<label><span data-i18n="reviewComment"></span><textarea data-role="review-input" rows="5" required></textarea></label>
<label><span data-i18n="fraudType"></span><select data-role="review-select" required></select></label>
<p data-role="review-error" class="review-error" role="alert" hidden></p>
<div class="review-actions"><button type="button" class="secondary" data-role="review-cancel" data-i18n="cancelReview"></button><button type="submit" class="primary" data-role="review-submit" data-i18n="submitReview"></button></div>
</form></dialog>
</main>
